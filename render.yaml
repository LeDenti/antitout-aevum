# Render blueprint for the sandbox relayer (agent/sandbox-server.mjs).
# SANDBOX_SEED is generated by Render and never leaves it; the relayer derives the keys of the one
# sandbox agent from it. Optional: add ANTHROPIC_API_KEY in the Render dashboard (Environment) to
# enable the two Claude Haiku brains; it is never written in this repository.
services:
  - type: web
    name: immunevault-sandbox
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: cd agent && npm install --omit=dev
    startCommand: node agent/sandbox-server.mjs
    healthCheckPath: /info
    envVars:
      - key: SANDBOX_SEED
        generateValue: true
      - key: NODE_VERSION
        value: "22"
